<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetroHub popup</title>
<style>
/* ───────── tokens ───────── */
html[data-theme="dark"] {
  --bg:#0f0f11; --pop:#17171a; --panel:#202025; --panel2:#2a2a31; --body:#2a2a31;
  --line:rgb(255 255 255 / .09); --line2:rgb(255 255 255 / .16);
  --ink:236 236 240; --muted:#9b9ba7; --accent:#2f6bff; --accent-hi:#4a80ff; --ok:#22a559; --ok-hi:#74de80; --bad:#ff6b5e;
}
html[data-theme="light"] {
  --bg:#e4e4e9; --pop:#fbfbfc; --panel:#f0f0f3; --panel2:#e6e6eb; --body:#eeeef1;
  --line:rgb(0 0 0 / .1); --line2:rgb(0 0 0 / .2);
  --ink:24 24 28; --muted:#656572; --accent:#1f5eff; --accent-hi:#3b73ff; --ok:#16a34a; --ok-hi:#16a34a; --bad:#d92d20;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 22px;
  background: var(--bg); color: rgb(var(--ink)); transition: background .3s;
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }

/* ───────── popup shell ───────── */
.popup {
  position: relative; width: 352px; padding: 16px; background: var(--pop);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 24px 60px rgb(0 0 0 / .4);
  transition: background .3s, border-color .3s;
}
.hd { display: flex; align-items: center; justify-content: space-between; height: 34px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.logo {
  width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
  font-size: 16px; font-weight: 700; border: 2px solid transparent;
  background: linear-gradient(var(--pop), var(--pop)) padding-box, linear-gradient(135deg,#ff8a3d,#d6336c,#7048e8) border-box;
}
.icons { display: flex; gap: 6px; }
.ib { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; cursor: pointer; background: transparent; border: 1px solid var(--line); transition: background .15s, border-color .15s; }
.ib:hover { background: var(--panel); border-color: var(--line2); }
.ib svg { width: 16px; height: 16px; }

/* ───────── segmented switch ───────── */
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.seg i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 5px; background: var(--accent); transition: transform .32s cubic-bezier(.3,.9,.25,1); }
.seg[data-mode="all"] i { transform: translateX(100%); }
.seg button { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 32px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--muted); transition: color .2s; }
.seg button[aria-selected="true"] { color: #fff; }
.seg svg { width: 15px; height: 15px; }

/* ───────── form ───────── */
.field { margin-top: 16px; position: relative; }
.field label, .field .lbl { display: block; margin-bottom: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.input, .select {
  width: 100%; height: 42px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: inherit; font-size: 13.5px; text-align: left;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.input:hover, .select:hover { border-color: var(--line2); }
.input:focus-within, .select[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--pop); }
.input input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: inherit; font: inherit; }
.input svg, .select > svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
.select { cursor: pointer; }
.select > svg { transition: transform .25s cubic-bezier(.3,.9,.25,1); }
.select[aria-expanded="true"] > svg { transform: rotate(180deg); }
.ws-name { display: flex; align-items: center; gap: 9px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok-hi); }
.list {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 4px; list-style: none;
  background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 16px 36px rgb(0 0 0 / .35);
  transform-origin: top; transform: scaleY(.92) translateY(-4px); opacity: 0; pointer-events: none; transition: transform .2s cubic-bezier(.3,.9,.25,1), opacity .15s;
}
.list.open { transform: none; opacity: 1; pointer-events: auto; }
.list li { position: relative; display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 12px; border-radius: 5px; cursor: pointer; font-size: 13.5px; }
.list li:hover, .list li.kb { background: rgb(var(--ink) / .08); }
.list li[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent); }

/* ───────── tabs being stashed ───────── */
.sum { display: flex; align-items: center; gap: 14px; margin-top: 18px; min-height: 46px; }
.tray { display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tile {
  width: 46px; height: 46px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  transition: transform .4s cubic-bezier(.3,.9,.25,1), opacity .3s, border-color .15s; animation: tin .4s cubic-bezier(.3,.9,.25,1) backwards;
}
.tile:hover { border-color: var(--line2); transform: translateY(-2px); }
.tile:nth-child(2) { animation-delay: .05s; } .tile:nth-child(3) { animation-delay: .1s; }
@keyframes tin { from { transform: scale(.7); opacity: 0; } }
.tray.fly .tile { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; transition: transform .55s cubic-bezier(.55,0,.75,.35), opacity .35s .2s; }
.fav { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--bg-f); color: var(--fg-f); font-weight: 700; font-size: 14px; }
.fav svg { width: 14px; height: 14px; }
.cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.cap b { color: rgb(var(--ink)); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ───────── stash tile ───────── */
.stash {
  position: relative; overflow: hidden; width: 100%; height: 60px; margin-top: 18px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
  border: 0; border-radius: 6px; background: var(--accent); color: #fff; text-align: left; cursor: pointer;
  transition: background .25s, transform .12s, color .25s;
}
.stash:hover:not(:disabled) { background: var(--accent-hi); }
.stash:active:not(:disabled) { transform: scale(.985); }
.stash .tx { display: grid; gap: 1px; }
.stash .big { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.stash .sub { font-size: 12px; opacity: .8; }
.stash .ico { width: 26px; height: 26px; flex: none; }
.stash .ico path { transition: stroke-dashoffset .4s .1s; }
.stash:disabled { background: var(--panel2); color: var(--muted); cursor: not-allowed; }
.stash:disabled .sub { color: var(--bad); opacity: 1; }
.stash.done, .stash.done:hover:not(:disabled) { background: var(--ok); }
.stash.done .ck { stroke-dasharray: 24; stroke-dashoffset: 0; animation: draw .45s .05s backwards; }
@keyframes draw { from { stroke-dashoffset: 24; } }

.controls { display: flex; gap: 10px; }
.btn { font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer; background: transparent; border: 1px solid rgb(var(--ink) / .3); }
.btn:hover { border-color: rgb(var(--ink) / .7); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ───────── PlugWire component CSS (copy this block) ───────── */
.pw { position: relative; height: 64px; width: auto; margin: 6px -16px 8px; }
.pw-svg {
  position: absolute; inset: 0; display: block; overflow: visible;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%);
}
.pw-fx { position: absolute; left: 0; pointer-events: none; }
.pw-wire  { fill: none; stroke: rgb(var(--ink)); stroke-width: 1.5; stroke-linecap: round; }
.pw-shape { fill: var(--body); stroke: rgb(var(--ink)); stroke-width: 1.5; stroke-linejoin: round; }
.pw-thin  { fill: none; stroke: rgb(var(--ink) / .4); stroke-width: 1.2; stroke-linecap: round; }
.pw-hole  { fill: none; stroke: rgb(var(--ink) / .85); stroke-width: 1.2; }
.pw-prong { fill: rgb(var(--ink)); }
.pw-dot   { fill: rgb(var(--ink) / .7); }
.pw-sr    { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

</style>
</head>
<body>

<main class="popup" id="popup">
  <header class="hd">
    <div class="brand"><span class="logo">m</span>MetroHub</div>
    <div class="icons">
      <button class="ib" id="theme" aria-label="Switch theme"></button>
      <button class="ib" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>

  <div class="pw" id="wire"></div>

  <div class="seg" id="seg" data-mode="all" role="tablist">
    <i></i>
    <button role="tab" data-m="current" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/></svg>Current Tab</button>
    <button role="tab" data-m="all" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M8 4h8"/></svg><span id="allLbl">All Tabs (3)</span></button>
  </div>

  <div class="field">
    <label for="grp">Group name</label>
    <div class="input"><input id="grp" autocomplete="off" spellcheck="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></div>
  </div>

  <div class="field">
    <span class="lbl" id="wsl">Workspace</span>
    <button class="select" id="ws" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="wsl ws">
      <span class="ws-name" id="wsName"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <ul class="list" id="wsList" role="listbox" aria-labelledby="wsl"></ul>
  </div>

  <div class="sum">
    <ul class="tray" id="tray"></ul>
    <div class="cap" id="cap"></div>
  </div>

  <button class="stash" id="stash">
    <span class="tx"><span class="big" id="big"></span><span class="sub" id="sub"></span></span>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ico"></svg>
  </button>
</main>

<div class="controls"><button class="btn" id="toggle" aria-pressed="false">Plug in</button></div>

<script>
/* ═════════════ PlugWire ═════════════
   new PlugWire(element, { connected: true|false })
   wire.setConnected(true|false)
   wire.refreshTheme()   // call after changing light/dark
   Needs CSS vars on an ancestor:  --ink ("r g b"), --body (plug fill)           */
(() => {
  const REAR = 28, PRONG = 10, YP = 4.6;      // plug geometry (px)
  const N = 28, PAD = 28, H = 64;           // rope points, canvas overflow, stage height
  const CY = 26.5, FLOOR = CY + 17, GAP = 22;
  const G = 1100;                           // rope gravity
  const rand  = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  class PlugWire {
    constructor(root, opts = {}) {
      this.root = root;
      this.on = opts.connected !== false;
      this.t = 0; this.acc = 0; this.last = 0; this.W = 0;
      this.plug = { x: 0, v: 0 }; this.sock = { x: 0, v: 0 };
      this.kP = 240; this.zP = .8; this.kS = 190; this.zS = .55;
      this.angP = 0; this.angS = 0;
      this.sparks = []; this.arcs = []; this.pulses = [];
      this.flash = 0; this.energy = this.on ? 1 : 0; this.tension = this.on ? 1 : 0;
      this.apart = !this.on; this.sepDone = !this.on;
      this.popAt = 0; this.trail = 0; this.trailT = 0; this.zapAt = 0; this.arcDue = 0;
      this.flow = { busy: false, wait: .6 };
      this.mq = matchMedia('(prefers-reduced-motion: reduce)');
      this.build();
      this.refreshTheme();
      this.resize();
      this.label();
      this.ro = new ResizeObserver(() => this.resize());
      this.ro.observe(root);
      this.raf = requestAnimationFrame(t => this.loop(t));
    }

    /* ───── DOM ───── */
    build() {
      this.root.innerHTML = `
      <svg class="pw-svg" aria-hidden="true">
        <path class="pw-wire" data-w="L"/><path class="pw-wire" data-w="R"/>
        <g class="pw-sock">
          <rect class="pw-shape" x="21" y="-3" width="7" height="6" rx="2.2"/>
          <path class="pw-shape" d="M0 -10H10C19 -10 24 -6 24 0S19 10 10 10H0Z"/>
          <path class="pw-thin" d="M8 -6.6C14 -6.6 17.5 -3.6 17.5 0"/>
          <circle class="pw-dot" cx="12" cy="4.4" r="1"/>
          <path class="pw-hole" d="M0 -6.8H9.2a2.2 2.2 0 0 1 0 4.4H0"/>
          <path class="pw-hole" d="M0 2.4H9.2a2.2 2.2 0 0 1 0 4.4H0"/>
        </g>
        <g class="pw-plug">
          <rect class="pw-shape" x="-28" y="-3" width="7" height="6" rx="2.2"/>
          <path class="pw-shape" d="M0 -10H-10C-19 -10 -24 -6 -24 0S-19 10 -10 10H0Z"/>
          <path class="pw-thin" d="M-8 -6.6C-14 -6.6 -17.5 -3.6 -17.5 0"/>
          <circle class="pw-dot" cx="-12" cy="4.4" r="1"/>
          <rect class="pw-prong" x="-1" y="-6" width="11" height="2.8" rx="1.3"/>
          <rect class="pw-prong" x="-1" y="3.2" width="11" height="2.8" rx="1.3"/>
        </g>
      </svg>
      <canvas class="pw-fx" aria-hidden="true"></canvas>
      <span class="pw-sr" role="status"></span>`;
      const q = s => this.root.querySelector(s);
      this.root.style.height = H + 'px';
      this.svg = q('svg'); this.wL = q('[data-w=L]'); this.wR = q('[data-w=R]');
      this.gP = q('.pw-plug'); this.gS = q('.pw-sock');
      this.cv = q('canvas'); this.ctx = this.cv.getContext('2d');
      this.sr = q('.pw-sr');
    }
    label() { this.sr.textContent = this.on ? 'Connected' : 'Disconnected'; }

    refreshTheme() {
      const ink = getComputedStyle(this.root).getPropertyValue('--ink').trim().split(/\s+/);
      this.rgb = ink.join(',');
      this.dark = (+ink[0]) > 128;
      this.cOk   = this.dark ? '74,222,128' : '22,163,74';     // plugged in
      this.cBad  = this.dark ? '255,92,80'  : '220,38,38';     // came apart
      this.cBad2 = this.dark ? '255,165,80' : '234,120,20';    // hotter edge of the sparks
    }

    /* ───── layout ───── */
    resize() {
      const w = Math.max(240, Math.round(this.root.clientWidth || 360));
      if (w === this.W) return;
      this.W = w; this.CX = w / 2;
      this.svg.setAttribute('width', w); this.svg.setAttribute('height', H);
      this.svg.setAttribute('viewBox', `0 0 ${w} ${H}`);
      this.dpr = Math.min(2, window.devicePixelRatio || 1);
      this.cv.width = w * this.dpr; this.cv.height = (H + PAD * 2) * this.dpr;
      this.cv.style.width = w + 'px'; this.cv.style.height = (H + PAD * 2) + 'px'; this.cv.style.top = -PAD + 'px';
      this.rL = this.makeRope(this.CX - REAR);
      this.rR = this.makeRope(w - (this.CX + REAR));
      this.snap();
    }
    makeRope(len) {
      const p = Array.from({ length: N }, () => ({ x: 0, y: CY, px: 0, py: CY }));
      return { p, total: len, seg: len / (N - 1), cum: new Float32Array(N), len };
    }
    targets() { const c = this.CX; return this.on ? [c, c] : [c - GAP, c + GAP]; }
    snap() {
      const [tp, ts] = this.targets();
      this.plug.x = tp; this.sock.x = ts; this.plug.v = this.sock.v = 0; this.tension = this.on ? 1 : 0;
      this.layout(this.rL, 0, tp - REAR); this.layout(this.rR, ts + REAR, this.W);
      for (let i = 0; i < 240; i++) this.stepRopes(1 / 120);
      this.measure(this.rL); this.measure(this.rR);
      this.angP = this.angS = 0;
    }
    layout(r, ax, bx) {
      const slack = Math.max(0, r.total - (bx - ax));
      const sag = Math.min(FLOOR - CY, Math.sqrt(3 * (bx - ax) * slack / 8));
      r.p.forEach((p, i) => {
        const u = i / (N - 1);
        p.x = p.px = ax + (bx - ax) * u; p.y = p.py = CY + sag * Math.sin(Math.PI * u);
      });
    }

    /* ───── state changes ───── */
    setConnected(on) {
      if (on === this.on) return;
      this.on = on; this.label();
      this.popAt = 0; this.trail = 0; this.arcDue = 0; this.arcs.length = 0;
      this.pulses.length = 0; this.flow.busy = false;
      if (this.mq.matches) { this.apart = !on; this.sepDone = !on; this.snap(); return; }
      if (on) {
        // aim slightly past the socket so the plug lands with real speed
        if (this.apart) { this.kP = 300; this.zP = .75; }
      } else {
        // tug: the plug resists for a beat, then pops free
        this.kP = 900; this.zP = 1; this.popAt = this.t + .11;
      }
    }

    /* ───── physics ───── */
    spring(o, tgt, k, z, h) {
      const c = 2 * z * Math.sqrt(k);
      o.v += (k * (tgt - o.x) - c * o.v) * h; o.x += o.v * h;
    }
    stepRope(r, ax, bx, h) {
      const P = r.p, n = P.length, seg = r.seg;
      for (let i = 1; i < n - 1; i++) {
        const p = P[i], vx = (p.x - p.px) * .992, vy = (p.y - p.py) * .992;
        p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + G * (1 - .97 * this.tension) * h * h;
      }
      const pin = () => {
        P[0].x = P[0].px = ax; P[0].y = P[0].py = CY;
        P[n - 1].x = P[n - 1].px = bx; P[n - 1].y = P[n - 1].py = CY;
      };
      pin();
      for (let it = 0; it < 14; it++) {
        for (let i = 0; i < n - 1; i++) {
          const a = P[i], b = P[i + 1];
          const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6, k = (d - seg) / d;
          const wa = i === 0 ? 0 : i === n - 2 ? 1 : .5, wb = i === 0 ? 1 : i === n - 2 ? 0 : .5;
          a.x += dx * k * wa; a.y += dy * k * wa; b.x -= dx * k * wb; b.y -= dy * k * wb;
        }
        for (let i = 0; i < n - 2; i++) {            // bending stiffness: it's a cable, not a thread
          const a = P[i], c = P[i + 2];
          const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || 1e-6, min = 2 * seg * .95;
          if (d < min) {
            const k = (min - d) / d;
            let wa = i === 0 ? 0 : .5, wc = i + 2 === n - 1 ? 0 : .5;
            if (!wa) wc = 1; if (!wc) wa = 1;
            a.x -= dx * k * wa; a.y -= dy * k * wa; c.x += dx * k * wc; c.y += dy * k * wc;
          }
        }
        for (let i = 1; i < n - 1; i++) {            // the surface the wire lies on
          const p = P[i];
          if (p.y > FLOOR) { p.y = FLOOR; p.px = p.x - (p.x - p.px) * .7; }
        }
        pin();
      }
    }
    stepRopes(h) {
      this.stepRope(this.rL, 0, this.plug.x - REAR, h);
      this.stepRope(this.rR, this.sock.x + REAR, this.W, h);   // right rope starts at the socket's rear
    }
    measure(r) {
      let s = 0; r.cum[0] = 0;
      for (let i = 1; i < N; i++) { s += Math.hypot(r.p[i].x - r.p[i - 1].x, r.p[i].y - r.p[i - 1].y); r.cum[i] = s; }
      r.len = s;
    }
    pointAt(r, s) {
      s = clamp(s, 0, r.len); let i = 1; const n = r.p.length;
      while (i < n - 1 && r.cum[i] < s) i++;
      const a = r.p[i - 1], b = r.p[i], span = r.cum[i] - r.cum[i - 1] || 1, u = (s - r.cum[i - 1]) / span;
      return [a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u];
    }
    shudder(amp) {
      for (const r of [this.rL, this.rR])
        r.p.forEach((p, i) => { p.py -= amp / 120 * Math.sin(Math.PI * i / (N - 1)); });
    }

    step(h) {
      this.t += h;
      const [tp, ts] = this.targets(), c = this.CX;
      // plug target
      let target = tp;
      if (this.popAt) target = c - 2.2;
      else if (this.on && this.apart) target = c + 18;
      if (this.popAt && this.t >= this.popAt) {                  // pop!
        this.popAt = 0; this.apart = true; this.sepDone = false;
        this.kP = 240; this.zP = .34; target = tp;
        this.plug.v = -640; this.sock.v = 110;
        this.zapAt = this.t + 3.4;
      }
      const tgoal = this.on && !this.apart && !this.popAt ? 1 : 0;
      this.tension += (tgoal - this.tension) * Math.min(1, h * (tgoal ? 7 : 30));
      this.spring(this.plug, target, this.kP, this.zP, h);
      this.spring(this.sock, ts, this.kS, this.on ? .9 : .42, h);

      const g = this.sock.x - this.plug.x;
      if (g < 0) {                                               // faces meet
        const vi = Math.max(0, this.plug.v - this.sock.v);
        this.plug.x = this.sock.x; this.plug.v = Math.min(this.plug.v, this.sock.v) * .1;
        if (this.on && this.apart) { this.apart = false; this.sock.v += vi * .22; this.contact(vi); this.kP = 240; this.zP = .8; }
      }
      if (!this.on && this.apart && !this.sepDone && g >= 9) { this.sepDone = true; this.separation(); }
      this.stepRopes(h);
    }

    /* ───── effects ───── */
    spark(x, y, ang, spd, life, w = 1.2, ember = false, col = this.rgb) {
      if (this.sparks.length > 140) return;
      this.sparks.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life, max: life, w, ember, col });
    }
    separation() {
      if (this.mq.matches) return;
      const x = this.sock.x;
      for (const y of [CY - YP, CY + YP]) {
        for (let i = 0; i < 7; i++) this.spark(x, y, Math.PI + rand(-.95, .95), rand(90, 300), rand(.25, .6), 1.2, false, Math.random() < .7 ? this.cBad : this.cBad2);
        for (let i = 0; i < 2; i++) this.spark(x, y, Math.PI + rand(-1.3, 1.3), rand(20, 70), rand(.8, 1.2), 1.6, true, this.cBad);
      }
      this.trail = .22; this.flash = .0; this.shudder(60);
    }
    contact(vi) {
      if (this.mq.matches) { this.startFlow(); return; }
      const n = Math.round(clamp(4 + vi / 70, 4, 10));
      for (const y of [CY - YP, CY + YP])
        for (let i = 0; i < n / 2; i++) this.spark(this.sock.x, y, rand(0, Math.PI * 2), rand(50, 210), rand(.18, .45), 1.1, false, Math.random() < .65 ? this.cOk : this.rgb);
      this.flash = 1; this.shudder(clamp(vi * .12, 20, 90));
      // the surge: one bright run to both edges, then the steady flow takes over
      let left = 2; const done = () => { if (--left === 0) { this.flow.busy = false; this.flow.wait = .5; } };
      this.flow.busy = true;
      this.addPulse({ r: this.rL, dir: -1, dur: .62, tail: 90, power: 1, out: true, done });
      this.addPulse({ r: this.rR, dir: +1, dur: .62, tail: 90, power: 1, out: true, done });
    }
    // one steady beat: edge -> plug -> THROUGH the pill (fork over the prongs) -> socket -> edge
    startFlow() {
      this.flow.busy = true;
      this.addPulse({ r: this.rL, dir: 1, dur: 1.15, tail: 62, power: .95, next: () =>
        this.addPulse({ kind: 'pill', dir: 1, dur: .7, tail: 34, power: 1, next: () =>
          this.addPulse({ r: this.rR, dir: 1, dur: 1.15, tail: 62, power: .95,
            done: () => { this.flow.busy = false; this.flow.wait = 1.1; } }) }) });
    }
    addPulse(o) { this.pulses.push(Object.assign({ t: 0, head: 0, fired: false, rs: o.kind === 'pill' ? this.routes() : [o.r] }, o)); }
    // the two paths a pulse can take inside the pill: along each prong, rejoining inside the socket
    routes() {
      const f = this.plug.x, s = this.sock.x, x0 = f - REAR, x1 = s + REAR;
      return [-1, 1].map(sg => {
        const y = CY + sg * YP;
        const p = [[x0, CY], [f - 11, CY], [f - 6, y], [s + PRONG + 1, y], [s + PRONG + 6, CY], [x1, CY]].map(([x, yy]) => ({ x, y: yy }));
        const cum = new Float32Array(p.length); let L = 0;
        for (let i = 1; i < p.length; i++) { L += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y); cum[i] = L; }
        return { p, cum, len: L };
      });
    }
    zap() {
      this.plug.v += 330;
      this.arcDue = this.t + .085;
    }

    fx(dt) {
      // wire energy
      const goal = this.on && !this.popAt ? 1 : 0;
      this.energy += (goal - this.energy) * Math.min(1, dt * (goal ? 3 : 9));
      this.flash = Math.max(0, this.flash - dt * 2.2);
      if (this.mq.matches) return;

      // steady flow
      if (this.on && !this.apart && !this.flow.busy) { this.flow.wait -= dt; if (this.flow.wait <= 0) this.startFlow(); }
      for (let i = this.pulses.length - 1; i >= 0; i--) {
        const p = this.pulses[i]; p.t += dt;
        p.rs = p.kind === 'pill' ? this.routes() : [p.r];
        const len = p.rs[0].len, q = clamp(p.t / p.dur, 0, 1);
        p.head = (p.out ? 1 - (1 - q) * (1 - q) : p.t / p.dur) * len;
        if (p.kind === 'pill' && p.head > len * .25 && p.head < len * .8) this.flash = Math.max(this.flash, .55);
        if (p.next && !p.fired && p.head >= len) { p.fired = true; p.next(); }
        if (p.next ? p.head >= len + p.tail : p.t >= p.dur) { this.pulses.splice(i, 1); p.done && p.done(); }
      }
      // spark trail right after unplugging
      if (this.trail > 0) {
        this.trail -= dt; this.trailT -= dt;
        if (this.trailT <= 0) {
          this.trailT = .03;
          const y = CY + (Math.random() < .5 ? -YP : YP);
          this.spark(this.plug.x + PRONG, y, Math.PI + rand(-1, 1), rand(40, 140), rand(.15, .3), .9, false, this.cBad2);
        }
      }
      // occasional attempt to reconnect
      if (!this.on && this.apart && this.sepDone && this.t >= this.zapAt) { this.zapAt = this.t + rand(2.8, 5.5); this.zap(); }
      if (this.arcDue && this.t >= this.arcDue) {
        this.arcDue = 0;
        const y = Math.random() < .5 ? -YP : YP;
        this.arcs.push({ y, t: 0, dur: .17 });
        for (let i = 0; i < 4; i++) this.spark(this.sock.x, CY + y, Math.PI + rand(-1.3, 1.3), rand(50, 150), rand(.2, .4), 1, false, this.cBad);
        this.shudder(26);
      }
      for (let i = this.arcs.length - 1; i >= 0; i--) { this.arcs[i].t += dt; if (this.arcs[i].t > this.arcs[i].dur) this.arcs.splice(i, 1); }
      // particles
      for (let i = this.sparks.length - 1; i >= 0; i--) {
        const s = this.sparks[i];
        s.life -= dt; if (s.life <= 0) { this.sparks.splice(i, 1); continue; }
        s.vy += (s.ember ? 160 : 560) * dt; s.vx *= 1 - 1.4 * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.y > FLOOR + 3 && s.vy > 0) { s.y = FLOOR + 3; s.vy *= -.3; s.vx *= .6; }
      }
    }

    /* ───── drawing ───── */
    pathD(P) {
      let d = `M${P[0].x.toFixed(2)} ${P[0].y.toFixed(2)}`;
      for (let i = 1; i < P.length - 1; i++) {
        const mx = (P[i].x + P[i + 1].x) / 2, my = (P[i].y + P[i + 1].y) / 2;
        d += `Q${P[i].x.toFixed(2)} ${P[i].y.toFixed(2)} ${mx.toFixed(2)} ${my.toFixed(2)}`;
      }
      const l = P[P.length - 1];
      return d + `L${l.x.toFixed(2)} ${l.y.toFixed(2)}`;
    }
    edge(x) { return clamp(Math.min(x, this.W - x) / 28, 0, 1); }

    render(dt) {
      this.measure(this.rL); this.measure(this.rR);
      this.wL.setAttribute('d', this.pathD(this.rL.p)); this.wR.setAttribute('d', this.pathD(this.rR.p));
      const op = .3 + .3 * this.energy;
      this.wL.style.opacity = this.wR.style.opacity = op;

      // plugs lean with their cable, but straighten as they near each other
      const g = this.sock.x - this.plug.x, align = clamp(g / 22, 0, 1);
      const pl = this.rL.p, pr = this.rR.p;
      const aP = clamp(Math.atan2(pl[N - 1].y - pl[N - 2].y, pl[N - 1].x - pl[N - 2].x), -.5, .5) * align;
      const aS = clamp(Math.atan2(pr[1].y - pr[0].y, pr[1].x - pr[0].x), -.5, .5) * align;
      const k = Math.min(1, dt * 16);
      this.angP += (aP - this.angP) * k; this.angS += (aS - this.angS) * k;
      this.gP.setAttribute('transform', `translate(${(this.plug.x - REAR).toFixed(2)} ${CY}) rotate(${(this.angP * 57.3).toFixed(2)}) translate(${REAR} 0)`);
      this.gS.setAttribute('transform', `translate(${(this.sock.x + REAR).toFixed(2)} ${CY}) rotate(${(this.angS * 57.3).toFixed(2)}) translate(${-REAR} 0)`);

      this.draw();
    }
    draw() {
      const c = this.ctx, rgb = this.rgb;
      c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      c.clearRect(0, 0, this.W, H + PAD * 2);
      c.translate(0, PAD); c.lineCap = 'round'; c.lineJoin = 'round';

      if (this.flash > .01) {                                    // soft green light at the contact point
        const gr = c.createRadialGradient(this.CX, CY, 0, this.CX, CY, 38);
        gr.addColorStop(0, `rgba(${this.cOk},${(this.dark ? .3 : .16) * this.flash})`);
        gr.addColorStop(1, `rgba(${this.cOk},0)`);
        c.fillStyle = gr; c.fillRect(this.CX - 40, CY - 40, 80, 80);
      }
      c.shadowColor = `rgba(${this.cOk},.9)`; c.shadowBlur = 9;
      for (const p of this.pulses) this.drawPulse(c, p);

      for (const a of this.arcs) {                               // red arc between prong and socket
        const life = 1 - a.t / a.dur, bucket = Math.floor(this.t * 45);
        const x1 = this.plug.x + PRONG + 1, y1 = CY + a.y, x2 = this.sock.x + 1, y2 = y1;
        const trace = () => {
          c.beginPath(); c.moveTo(x1, y1);
          for (let i = 1; i < 5; i++) {
            const u = i / 5, r = Math.sin((bucket * 13.37 + i * 7.1)) * 43758.5453;
            c.lineTo(x1 + (x2 - x1) * u, y1 + ((r - Math.floor(r)) - .5) * 8 * Math.sin(Math.PI * u));
          }
          c.lineTo(x2, y2);
        };
        c.shadowColor = `rgba(${this.cBad},.9)`; c.shadowBlur = 10;
        trace(); c.strokeStyle = `rgba(${this.cBad},${.9 * life})`; c.lineWidth = 1.7; c.stroke();
        c.shadowBlur = 0;
        trace(); c.strokeStyle = `rgba(${this.dark ? '255,235,225' : this.cBad2},${.9 * life})`; c.lineWidth = .7; c.stroke();
      }
      for (const s of this.sparks) {
        const al = Math.pow(s.life / s.max, 1.2) * (s.ember ? .8 + .2 * Math.sin(this.t * 50 + s.x) : 1);
        c.shadowColor = `rgba(${s.col},.9)`; c.shadowBlur = 6;
        c.strokeStyle = c.fillStyle = `rgba(${s.col},${al})`;
        if (s.ember) { c.beginPath(); c.arc(s.x, s.y, s.w * .7, 0, 6.283); c.fill(); }
        else { c.lineWidth = s.w; c.beginPath(); c.moveTo(s.x - s.vx * .024, s.y - s.vy * .024); c.lineTo(s.x, s.y); c.stroke(); }
      }
      c.shadowBlur = 0;
    }
    drawPulse(c, p) {
      const K = 14, pill = p.kind === 'pill';
      for (const r of p.rs) {
        for (let k = 0; k < K; k++) {
          let s0 = p.head - p.tail * k / K, s1 = p.head - p.tail * (k + 1) / K;
          if (s0 < 0) continue; s1 = Math.max(0, s1); if (s1 > r.len) continue; s0 = Math.min(s0, r.len);
          const a0 = p.dir > 0 ? s0 : r.len - s0, a1 = p.dir > 0 ? s1 : r.len - s1;
          const A = this.pointAt(r, a0), B = this.pointAt(r, a1);
          const fade = pill ? .8 : this.edge((A[0] + B[0]) / 2);
          const al = p.power * this.energy * Math.pow(1 - k / K, 1.7) * fade;
          if (al < .01) continue;
          c.strokeStyle = `rgba(${this.cOk},${al})`; c.lineWidth = (pill ? 2 : 2.3) - .9 * k / K;
          c.beginPath(); c.moveTo(A[0], A[1]); c.lineTo(B[0], B[1]); c.stroke();
          if (k < 3 && this.dark) {                              // hot white core at the head
            c.strokeStyle = `rgba(235,255,242,${al * .75})`; c.lineWidth = .9;
            c.beginPath(); c.moveTo(A[0], A[1]); c.lineTo(B[0], B[1]); c.stroke();
          }
        }
      }
    }

    loop(now) {
      const dt = Math.min(.033, (now - (this.last || now)) / 1000); this.last = now;
      if (this.mq.matches) {
        // reduced motion: no springs, no particles; state changes snap
        this.snap(); this.fx(dt); this.render(dt);
      } else {
        this.acc += dt;
        while (this.acc >= 1 / 120) { this.step(1 / 120); this.acc -= 1 / 120; }
        this.fx(dt); this.render(dt);
      }
      this.raf = requestAnimationFrame(t => this.loop(t));
    }
    destroy() { cancelAnimationFrame(this.raf); this.ro.disconnect(); this.root.innerHTML = ''; }
  }

  window.PlugWire = PlugWire;
})();

</script>

<script>
/* ═════════════ popup logic (demo) ═════════════ */
const $ = s => document.querySelector(s);
const ICON = {
  layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5" opacity=".55"/>',
  check:  '<path class="ck" d="M5 12.5l4.5 4.5L19 7.5"/>',
  off:    '<path d="M4 4l16 16"/><path d="M9 5.5h6M12 5.5V9M7 12.5h10l-1 4.5a3 3 0 0 1-3 2.5h-2a3 3 0 0 1-3-2.5z"/>'
};
const TABS = [
  { t: 'Google',      html: '<span class="fav" style="--bg-f:#fff;--fg-f:#4285f4">G</span>' },
  { t: 'Claude',      html: '<span class="fav" style="--bg-f:#d97757;--fg-f:#fff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg></span>' },
  { t: 'Scratchpad',  html: '<span class="fav" style="--bg-f:#f6c945;--fg-f:#3b2f00"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg></span>' },
];
const WS = ['Main', 'Work', 'Reading list'];
const S = { mode: 'all', ws: 0, connected: false, busy: false };
const wire = new PlugWire($('#wire'), { connected: false });

// group name defaults to "Session • <date>, <time>"
{ const d = new Date(); $('#grp').value = `Session • ${d.toLocaleString('en-US', { month: 'short' })} ${d.getDate()}, ${d.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit' })}`; }

function items() { return S.mode === 'all' ? TABS : TABS.slice(0, 1); }
function drawTray() {
  $('#tray').innerHTML = items().map(t => `<li class="tile" title="${t.t}">${t.html}</li>`).join('');
  const n = items().length;
  $('#cap').innerHTML = `<b>${n}</b> ${n === 1 ? 'tab' : 'tabs'} will be grouped`;
}
function render() {
  const n = items().length, b = $('#stash');
  $('#seg').dataset.mode = S.mode;
  document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-selected', x.dataset.m === S.mode));
  $('#allLbl').textContent = `All Tabs (${TABS.length})`;
  $('#wsName').innerHTML = `${WS[S.ws]}${S.ws === 0 ? '<span class="live">Active</span>' : ''}`;
  if (S.busy) return;
  b.classList.remove('done');
  b.disabled = !S.connected;
  $('#big').textContent = S.connected ? `Stash ${n} ${n === 1 ? 'tab' : 'tabs'}` : 'Can’t stash right now';
  $('#sub').textContent = S.connected ? `to ${WS[S.ws]}` : 'Not connected to MetroHub';
  $('#ico').innerHTML = S.connected ? ICON.layers : ICON.off;
  $('#toggle').textContent = S.connected ? 'Unplug' : 'Plug in'; $('#toggle').setAttribute('aria-pressed', S.connected);
}
function setConnected(on) { S.connected = on; wire.setConnected(on); render(); }

// segmented switch
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { if (S.busy || S.mode === b.dataset.m) return; S.mode = b.dataset.m; drawTray(); render(); });

// workspace listbox
const list = $('#wsList'), sel = $('#ws');
list.innerHTML = WS.map((w, i) => `<li role="option" data-i="${i}">${w}${i === 0 ? '<span class="live">Active</span>' : ''}</li>`).join('');
function paintList() { list.querySelectorAll('li').forEach((li, i) => li.setAttribute('aria-selected', i === S.ws)); }
function toggleList(open) { list.classList.toggle('open', open); sel.setAttribute('aria-expanded', open); paintList(); }
sel.onclick = e => { e.stopPropagation(); toggleList(!list.classList.contains('open')); };
list.onclick = e => { const li = e.target.closest('li'); if (!li) return; S.ws = +li.dataset.i; toggleList(false); render(); };
document.addEventListener('click', () => toggleList(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleList(false); });

// stash: the tabs fly into the tile, which turns green
$('#stash').onclick = () => {
  if (!S.connected || S.busy) return;
  S.busy = true;
  const b = $('#stash'), br = b.getBoundingClientRect(), n = items().length;
  document.querySelectorAll('#tray .tile').forEach((t, i) => {
    const r = t.getBoundingClientRect();
    t.style.setProperty('--dx', (br.left + br.width - 40 - (r.left + r.width / 2)) + 'px');
    t.style.setProperty('--dy', (br.top + br.height / 2 - (r.top + r.height / 2)) + 'px');
    t.style.transitionDelay = `${i * 70}ms`;
  });
  $('#tray').classList.add('fly');
  setTimeout(() => {
    b.classList.add('done');
    $('#big').textContent = `Stashed ${n} ${n === 1 ? 'tab' : 'tabs'}`; $('#sub').textContent = `to ${WS[S.ws]}`; $('#ico').innerHTML = ICON.check;
  }, 420 + n * 70);
  setTimeout(() => { S.busy = false; $('#tray').classList.remove('fly'); drawTray(); render(); }, 2600);
};

// theme
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#theme').innerHTML = t === 'dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
  wire.refreshTheme();
}
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#toggle').onclick = () => setConnected(!S.connected);

setTheme('dark'); drawTray(); render();
setTimeout(() => setConnected(true), 900);   // opening moment: the wire plugs itself in and the stash tile wakes up
</script>
</body>
