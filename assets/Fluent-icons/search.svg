<svg width="256" height="256" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fluent Azure Lens Ring (Top-Left to Bottom-Right) -->
    <linearGradient id="fluentRing" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="17" y2="17">
      <stop offset="0%" stop-color="#4CC2FF" />
      <stop offset="50%" stop-color="#168BFF" />
      <stop offset="100%" stop-color="#0A4EA8" />
    </linearGradient>

    <!-- Soft Tinted Glass Fill -->
    <linearGradient id="fluentGlass" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="16" y2="16">
      <stop offset="0%" stop-color="#4CC2FF" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0.08" />
    </linearGradient>

    <!-- Anodized Charcoal Handle -->
    <linearGradient id="fluentHandle" gradientUnits="userSpaceOnUse" x1="15" y1="15" x2="21" y2="21">
      <stop offset="0%" stop-color="#605E5C" />
      <stop offset="100%" stop-color="#201F1E" />
    </linearGradient>
  </defs>

  <path d="M15 15L21 21" stroke="url(#fluentHandle)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="10" cy="09" r="7" fill="url(#fluentGlass)" stroke="url(#fluentRing)" stroke-width="2" />
</svg>