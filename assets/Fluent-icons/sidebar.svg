<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top App Tile: Primary Fluent Violet -->
    <linearGradient id="tilePrimary" gradientUnits="userSpaceOnUse" x1="4" y1="5" x2="14.5" y2="15.5">
      <stop offset="0%" stop-color="#A67CE0" />
      <stop offset="100%" stop-color="#7A41DC" />
    </linearGradient>

    <!-- Bottom App Tile: Stepped Deep Amethyst -->
    <linearGradient id="tileSecondary" gradientUnits="userSpaceOnUse" x1="4" y1="20.5" x2="14.5" y2="31">
      <stop offset="0%" stop-color="#8764B8" />
      <stop offset="100%" stop-color="#5C2D91" />
    </linearGradient>

    <!-- Title Bars: Fluent Cyan-to-Blue -->
    <linearGradient id="barTitle" gradientUnits="userSpaceOnUse" x1="17.5" y1="6" x2="32" y2="25">
      <stop offset="0%" stop-color="#36DFF1" />
      <stop offset="100%" stop-color="#0094F0" />
    </linearGradient>

    <!-- Subtitle Detail Bars: Cool Silver-Slate -->
    <linearGradient id="barDetail" gradientUnits="userSpaceOnUse" x1="17.5" y1="11" x2="28.5" y2="30">
      <stop offset="0%" stop-color="#B9C0C7" />
      <stop offset="100%" stop-color="#889096" />
    </linearGradient>
  </defs>

  <g transform="scale(7.111111111111111)">
    <!-- Row 1: Primary App Tile + Title/Detail Bars -->
    <rect x="4" y="5" width="10.5" height="10.5" rx="0.5" fill="url(#tilePrimary)" />
    <rect x="17.5" y="6.25" width="14.5" height="3.25" rx="1.625" fill="url(#barTitle)" />
    <rect x="17.5" y="11" width="9.5" height="3.25" rx="1.625" fill="url(#barDetail)" />

    <!-- Row 2: Secondary App Tile + Title/Detail Bars -->
    <rect x="4" y="20.5" width="10.5" height="10.5" rx="0.55" fill="url(#tileSecondary)" />
    <rect x="17.5" y="21.75" width="14.5" height="3.25" rx="1.625" fill="url(#barTitle)" />
    <rect x="17.5" y="26.5" width="11" height="3.25" rx="1.625" fill="url(#barDetail)" />
  </g>
</svg>
