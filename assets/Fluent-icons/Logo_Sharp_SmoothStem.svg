      <feFlood flood-color="#001742" flood-opacity="0.28" result="color1" />
      <feComposite in="color1" in2="blur1" operator="in" result="shadow1" />

      <feOffset in="SourceAlpha" dx="3" dy="14" result="off2" />
      <feGaussianBlur in="off2" stdDeviation="12" result="blur2" />
      <feFlood flood-color="#001238" flood-opacity="0.34" result="color2" />
      <feComposite in="color2" in2="blur2" operator="in" result="shadow2" />

      <feMerge>
        <feMergeNode in="shadow2" />
        <feMergeNode in="shadow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="tileClip">
