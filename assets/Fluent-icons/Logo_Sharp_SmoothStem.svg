<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgLower" x1="0" y1="120" x2="420" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A7BE8" />
      <stop offset="50%" stop-color="#0C5CC7" />
      <stop offset="100%" stop-color="#00368A" />
    </linearGradient>

    <linearGradient id="bgUpper" x1="80" y1="0" x2="512" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3BA4FF" />
      <stop offset="50%" stop-color="#1E84F0" />
      <stop offset="100%" stop-color="#0A59C4" />
