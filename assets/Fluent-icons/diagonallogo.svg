<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Single smooth 5-stop gradient (no stacked alpha overlays or 8-bit blur filters) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E98FC" />
      <stop offset="25%" stop-color="#1F82EC" />
      <stop offset="50%" stop-color="#126CD9" />
      <stop offset="75%" stop-color="#0757C1" />
      <stop offset="100%" stop-color="#0043A4" />
    </linearGradient>

    <clipPath id="tileClip">
      <rect x="0" y="0" width="512" height="512" rx="0.5" ry="0.5" />
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- Chamfered background stops 12px before the top-left & bottom-right rx="18" corners
         so blue never bleeds through the white rounded corners during anti-aliasing -->
    <path d="M 30 0 L 512 0 L 512 482 L 482 512 L 0 512 L 0 30 Z" fill="url(#bgGrad)" />

    <!-- Pure vector 56px stroke mark with 34px/90px concentric radii and 28px round stem caps -->
    <path d="M -66.36 -105.96
         L 133.64 94.04
         A 90 90 0 0 1 160 157.68
         C 167.5 149.2 178 144 194 144
         A 90 90 0 0 1 256 168.76
         A 90 90 0 0 1 408 234
         L 408 354.32
         A 34 34 0 0 0 417.96 378.36
         L 617.96 578.36
         L 578.36 617.96
         L 378.36 417.96
         A 90 90 0 0 1 352 354.32
         L 352 234
         A 34 34 0 0 0 284 234
         L 284 340
         A 28 28 0 0 1 228 340
         L 228 234
         A 34 34 0 0 0 160 234
         L 160 340
         A 28 28 0 0 1 104 340
         L 104 157.68
         A 34 34 0 0 0 94.04 133.64
         L -105.96 -66.36
         Z" fill="#FFFFFF" />
  </g>
</svg>