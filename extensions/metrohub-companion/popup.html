<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetroHub Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-shell">
    <!-- Header: MetroHub Brand + Theme Switcher + Hamburger Menu -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo-wrap">
          <img class="brand-logo" src="icons/icon48.png" width="24" height="24" alt="MetroHub" />
        </div>
        <span class="brand-title">MetroHub</span>
      </div>

      <div class="header-actions">
        <button type="button" id="themeToggleBtn" class="header-icon-btn theme-toggle-btn" aria-label="Toggle light/dark theme" title="Toggle theme">
          <svg class="theme-icon moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="theme-icon sun-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button type="button" id="menuToggleBtn" class="header-icon-btn menu-toggle-btn" aria-label="Open preferences" title="Preferences" aria-expanded="false" aria-haspopup="dialog">
          <svg class="menu-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Settings Dropdown Popover -->
      <div id="settingsMenu" class="settings-menu hidden" role="dialog" aria-label="Preferences">
        <div class="settings-menu-header">
          <span class="settings-menu-title">Preferences</span>
        </div>
        <div class="settings-section">
          <span class="settings-section-label">Default Tile Size</span>
          <div class="settings-options-list" role="radiogroup" aria-label="Default tile size">
            <button type="button" id="menuSize2x2" class="settings-option-item active" role="radio" aria-checked="true" data-size="2x2">
              <div class="settings-option-label">
                <svg class="seg-svg" width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                  <rect x="2" y="2" width="12" height="12" rx="1.5"/>
                </svg>
                <span>2×2 Standard</span>
              </div>
              <svg class="check-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
            <button type="button" id="menuSize4x2" class="settings-option-item" role="radio" aria-checked="false" data-size="4x2">
              <div class="settings-option-label">
                <svg class="seg-svg" width="17" height="11" viewBox="0 0 20 14" fill="currentColor" aria-hidden="true">
                  <rect x="1" y="2.5" width="18" height="9" rx="1.5"/>
                </svg>
                <span>4×2 Wide</span>
              </div>
              <svg class="check-icon hidden" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-section">
          <button type="button" id="openGitHubBtn" class="settings-link-item" title="Open MetroHub on GitHub">
            <div class="settings-option-label">
              <svg class="github-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
              <span>MetroHub</span>
            </div>
            <svg class="external-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Animated Plug & Socket Cable Divider -->
    <div class="pw" id="wire" aria-hidden="true"></div>

    <!-- Main Content Form -->
    <main class="app-body">
      <!-- Mode Switcher: Single Tab vs All Tabs -->
      <div class="mode-switcher" id="modeSwitcher" data-active="single" role="tablist" aria-label="Pin mode">
        <div class="mode-slider" aria-hidden="true"></div>
        <button type="button" id="modeSingleTab" class="mode-tab active" role="tab" aria-selected="true">
          <svg class="mode-tab-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <line x1="2" y1="9" x2="22" y2="9"></line>
            <circle cx="16" cy="6.5" r="0.75" fill="currentColor"></circle>
            <circle cx="18.5" cy="6.5" r="0.75" fill="currentColor"></circle>
          </svg>
          <span>Current Tab</span>
        </button>
        <button type="button" id="modeAllTabs" class="mode-tab" role="tab" aria-selected="false">
          <svg class="mode-tab-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 5.5v-0.5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v0.5"></path>
            <path d="M4 8.5v-0.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v0.5"></path>
            <rect x="2" y="9.5" width="20" height="12" rx="2"></rect>
            <line x1="2" y1="14" x2="22" y2="14"></line>
            <circle cx="16" cy="11.8" r="0.75" fill="currentColor"></circle>
            <circle cx="18.5" cy="11.8" r="0.75" fill="currentColor"></circle>
          </svg>
          <span id="allTabsLabelText">All Tabs</span>
        </button>
      </div>

      <!-- Title / Group Name Input -->
      <div class="form-row">
        <label for="tileTitle" id="tileTitleLabel" class="row-label">Title</label>
        <div class="input-wrap">
          <input type="text" id="tileTitle" class="text-input" placeholder="Page title" spellcheck="false" autocomplete="off" />
          <svg class="input-trailing-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
            <path d="m15 5 4 4"/>
          </svg>
        </div>
      </div>

      <!-- Workspace Selection (Custom Cohesive Dropdown) -->
      <div class="form-row">
        <label id="workspaceLabel" class="row-label">Workspace</label>
        <div class="custom-dropdown" id="workspaceDropdown">
          <button type="button" id="workspaceTrigger" class="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="workspaceLabel">
            <span id="workspaceSelectedText" class="dropdown-selected-text">
              <span class="ws-name">Main</span>
            </span>
            <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="workspaceMenu" class="dropdown-menu hidden" role="listbox" tabindex="-1">
            <button type="button" class="dropdown-item selected" role="option" aria-selected="true" data-id="">
              <span class="ws-name">Main</span>
              <span class="live">Active</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Favicon Preview Row (Current Tab Mode) -->
      <div class="favicon-card" id="faviconCard">
        <div class="favicon-wrap">
          <img id="faviconPreview" width="28" height="28" src="" alt="Favicon" />
        </div>
        <span class="favicon-domain" id="faviconDomain">Website</span>
      </div>

      <!-- Session Group Summary (All Tabs Mode) -->
      <div class="session-card hidden" id="sessionCard">
        <div class="session-favicon-stack" id="sessionFaviconStack" aria-label="Tabs to be grouped"></div>
        <div class="session-summary-text" id="sessionSummaryText">Loading tabs...</div>
      </div>
    </main>

    <!-- Footer Action - AIO (All-In-One) Action Tile -->
    <footer class="app-footer">
      <button type="button" id="pinBtn" class="submit-btn" disabled>
        <span class="btn-tx">
          <span class="btn-big" id="pinBtnBig">Pin to MetroHub</span>
          <span class="btn-sub" id="pinBtnSub">to Main</span>
        </span>
        <div class="btn-icon-wrap">
          <svg class="ico-pin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
          </svg>
          <svg class="ico-stash hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path>
            <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path>
            <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path>
          </svg>
          <svg class="ico-off hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"></path>
            <path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"></path>
          </svg>
          <svg class="ico-check hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path class="ck" d="M20 6 9 17l-5-5"></path>
          </svg>
          <span class="btn-spinner hidden" aria-hidden="true"></span>
        </div>
      </button>

      <div id="feedbackBanner" class="feedback-banner hidden" style="display: none !important;"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
