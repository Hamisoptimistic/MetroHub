<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetroHub Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-shell">
    <!-- Header: MetroHub Brand + Minimal Connected Status + Theme Switcher -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo-wrap">
          <img class="brand-logo" src="icons/icon48.png" width="24" height="24" alt="MetroHub" />
        </div>
        <span class="brand-title">MetroHub</span>
      </div>

      <div class="header-actions">
        <div id="statusBadge" class="status-indicator connecting" role="status" aria-label="Checking connection..." title="Checking...">
          <canvas id="plugCanvas" class="plug-canvas" aria-hidden="true"></canvas>
          <span id="statusText" class="status-text visually-hidden">Checking...</span>
        </div>
        <button type="button" id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle light/dark theme" title="Toggle theme">
          <svg class="theme-icon moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="theme-icon sun-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Form -->
    <main class="app-body">
      <!-- Mode Switcher: Single Tab vs All Tabs -->
      <div class="mode-switcher" role="tablist" aria-label="Pin mode">
        <button type="button" id="modeSingleTab" class="mode-tab active" role="tab" aria-selected="true">
          <svg class="mode-tab-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>Current Tab</span>
        </button>
        <button type="button" id="modeAllTabs" class="mode-tab" role="tab" aria-selected="false">
          <svg class="mode-tab-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2z"></path>
          </svg>
          <span id="allTabsLabelText">All Tabs</span>
        </button>
      </div>

      <!-- Title / Group Name Input -->
      <div class="form-row">
        <label for="tileTitle" id="tileTitleLabel" class="row-label">Title</label>
        <div class="input-wrap">
          <input type="text" id="tileTitle" class="text-input" placeholder="Page title" spellcheck="false" autocomplete="off" />
          <svg class="input-trailing-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </div>
      </div>

      <!-- Segmented Control: Tile Dimensions -->
      <div class="form-row" id="sizeRow">
        <label class="row-label">Size</label>
        <div class="segmented-control">
          <button type="button" id="size2x2" class="seg-btn active" data-span-x="2" data-span-y="2">
            <svg class="seg-svg" width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <rect x="2" y="2" width="12" height="12" rx="1.5"/>
            </svg>
            <span>2×2 Standard</span>
          </button>
          <button type="button" id="size4x2" class="seg-btn" data-span-x="4" data-span-y="2">
            <svg class="seg-svg" width="17" height="11" viewBox="0 0 20 14" fill="currentColor" aria-hidden="true">
              <rect x="1" y="2.5" width="18" height="9" rx="1.5"/>
            </svg>
            <span>4×2 Wide</span>
          </button>
        </div>
      </div>

      <!-- Workspace Selection (Custom Cohesive Dropdown) -->
      <div class="form-row">
        <label id="workspaceLabel" class="row-label">Workspace</label>
        <div class="custom-dropdown" id="workspaceDropdown">
          <button type="button" id="workspaceTrigger" class="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="workspaceLabel">
            <span id="workspaceSelectedText" class="dropdown-selected-text">Main (Active)</span>
            <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="workspaceMenu" class="dropdown-menu hidden" role="listbox">
            <button type="button" class="dropdown-item selected" role="option" aria-selected="true" data-id="">
              <span>Main (Active)</span>
              <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Favicon Preview Row (Current Tab Mode) -->
      <div class="favicon-card" id="faviconCard">
        <div class="favicon-wrap">
          <img id="faviconPreview" width="22" height="22" src="" alt="Favicon" />
        </div>
        <span class="favicon-domain" id="faviconDomain">Website</span>
      </div>

      <!-- Session Group Summary Card (All Tabs Mode) -->
      <div class="session-card hidden" id="sessionCard">
        <div class="session-header">
          <div class="session-icon-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <div class="session-details">
            <span class="session-count-title" id="sessionSummaryText">Loading tabs...</span>
            <span class="session-subtext">Desktop Tile Group</span>
          </div>
        </div>
        <label class="close-tabs-toggle" for="closeTabsCheckbox">
          <input type="checkbox" id="closeTabsCheckbox" class="custom-checkbox" checked />
          <span class="toggle-label-text">Close tabs after stashing</span>
        </label>
      </div>
    </main>

    <!-- Footer Action -->
    <footer class="app-footer">
      <button type="button" id="pinBtn" class="submit-btn" disabled>
        <svg class="pin-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="17" x2="12" y2="22"></line>
          <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.89A2 2 0 0 1 15 10.77V5a3 3 0 0 0-6 0v5.77a2 2 0 0 1-1.11 1.79l-1.78.89A2 2 0 0 0 5 15.24V17z"></path>
        </svg>
        <svg class="stash-svg hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <svg class="check-svg hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span class="btn-text">Pin to MetroHub</span>
        <span class="btn-spinner hidden"></span>
      </button>

      <div id="feedbackBanner" class="feedback-banner hidden"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
